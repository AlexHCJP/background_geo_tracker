name: background_geo_tracker
description: >-
  Background route tracking for iOS and Android, collected and uploaded in
  native code.
version: 0.11.0

homepage: https://github.com/tahayildirm/background_geo_tracker
repository: https://github.com/tahayildirm/background_geo_tracker
issue_tracker: https://github.com/tahayildirm/background_geo_tracker/issues
documentation: https://github.com/tahayildirm/background_geo_tracker#readme

topics:
  - geolocation
  - location
  - gps
  - tracking
  - background

environment:
  sdk: ^3.12.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    # Both platforms are implemented natively and neither is a stub, so pub.dev
    # infers the platform badges from this block. No `platforms:` key above:
    # for a plugin it is derived from here, and stating it twice invites the
    # two to disagree.
    platforms:
      android:
        package: dev.background_geo_tracker.plugin
        pluginClass: BackgroundGeoTrackerPlugin
      ios:
        pluginClass: BackgroundGeoTrackerPlugin
